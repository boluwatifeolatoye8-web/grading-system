<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grading System</title>
    <style>
        :root {
            --navy: #0a1833;
            --navy-light: #182b50;
            --purple: #7654d6;
            --purple-dark: #6040bd;
            --cream: #111f3d;
            --white: #ffffff;
            --muted: #626b82;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: grid;
            place-items: center;
            color: var(--white);
            background:
                radial-gradient(circle at 88% 12%, rgba(118, 84, 214, 0.3), transparent 22rem),
                linear-gradient(135deg, #08152d 0%, #111d3d 55%, #211844 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        .grading-card {
            width: min(760px, 100%);
            padding: 42px;
            border: 1px solid rgba(153, 130, 224, 0.3);
            border-radius: 24px;
            background: var(--cream);
            box-shadow: 0 24px 60px rgba(2, 13, 28, 0.38);
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 12px;
            padding: 7px 12px;
            border-radius: 999px;
            color: #eee9ff;
            background: rgba(118, 84, 214, 0.32);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--white);
            font-size: clamp(2.2rem, 7vw, 4rem);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .intro {
            max-width: 590px;
            margin: 16px 0 30px;
            color: #c3cbe0;
            line-height: 1.65;
        }

        #secondarySection,
        .level-section {
            display: grid;
            grid-template-columns: 1fr auto;
            column-gap: 12px;
            row-gap: 8px;
            margin-top: 14px;
            padding: 22px;
            border: 1px solid #453b70;
            border-radius: 16px;
            background: linear-gradient(145deg, var(--navy) 0%, #29204f 100%);
            box-shadow: 0 10px 24px rgba(10, 24, 51, 0.2);
        }

        #secondarySection label,
        .level-section label {
            grid-column: 1 / -1;
            color: var(--white);
            font-weight: 800;
        }

        input {
            width: 100%;
            min-width: 0;
            height: 48px;
            border: 2px solid #414b70;
            border-radius: 10px;
            padding: 0 14px;
            color: var(--white);
            background: #1b2949;
            font: inherit;
            font-weight: 700;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 4px rgba(118, 84, 214, 0.16);
        }

        input::placeholder {
            color: #aab4ce;
        }

        small {
            grid-column: 1 / -1;
            color: #d9d4eb;
            font-size: 0.78rem;
        }

        #secondaryDisplay,
        #polytechnicDisplay,
        .result {
            grid-column: 1 / -1;
            min-height: 0;
            color: #c9b8ff;
            font-weight: 800;
        }

        #secondaryDisplay p,
        #polytechnicDisplay p,
        .result p {
            margin: 4px 0 0;
        }

        button {
            height: 48px;
            border: 0;
            border-radius: 10px;
            padding: 0 18px;
            color: var(--white);
            background: var(--purple);
            box-shadow: 0 8px 18px rgba(96, 64, 189, 0.26);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            background: var(--purple-dark);
            box-shadow: 0 10px 22px rgba(96, 64, 189, 0.36);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid var(--purple);
            outline-offset: 3px;
        }

        @media (max-width: 560px) {
            body {
                padding: 18px 12px;
                align-items: start;
            }

            .grading-card {
                padding: 26px 18px;
                border-radius: 18px;
            }

            #secondarySection,
            .level-section {
                grid-template-columns: 1fr;
                padding: 18px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <section class="grading-card">
        <p class="eyebrow">Academic tool</p>
        <h1>Grading system</h1>
        <p class="intro">Welcome to the official grading page. Choose your education level to enter a score or CGPA.</p>

        <div id="secondarySection">
            <label for="secondaryInput">Your score</label>
            <input id="secondaryInput" type="number" placeholder="Enter your score">
            <small>Enter a score from 0 to 100.</small>
            <div id="secondaryDisplay"></div>
            <button type="button" onclick="secondary()">Check score</button>
        </div>

        <div id="polytechnicSection" class="level-section">
            <label for="polytechnicInput">Your CGPA (out of 4.00)</label>
            <input id="polytechnicInput" type="number" min="0" max="4" step="0.01" placeholder="Enter your CGPA">
            <small class="hint">Enter a CGPA from 0.00 to 4.00.</small>
            <div id="polytechnicDisplay"></div>
            <button type="button" onclick="polytechnic()">Check CGPA</button>
        </div>

        <div id="universitySection" class="level-section">
            <label for="universityInput">Your CGPA (out of 5.00)</label>
            <input id="universityInput" type="number" min="0" max="5" step="0.01" placeholder="Enter your CGPA">
            <small>Enter a CGPA from 0.00 to 5.00.</small>
            <div id="universityDisplay" class="result" aria-live="polite"></div>
            <button type="button" onclick="University()">Check CGPA</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
